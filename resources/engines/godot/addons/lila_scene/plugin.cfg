[plugin]

name="Lila"
description="Imports Lila scenes (.lila, .lilaa) through lilabatch and glTF and re-imports them when they are saved in Lila. Lila Sync in the toolbar moves objects as they move in Lila. A starting point to build on, not a supported plugin."
author="Lila"
version="1.0"
script="plugin.gd"
